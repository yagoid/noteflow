<!doctype html>
<!-- Legacy URL of the old, standalone NoteFlow Mobile privacy policy (it was the Play Store
     listing's privacy URL). Since 2026-11-12 the single policy at /noteflow/privacy/ covers the
     desktop AND the Android app, so this page only redirects there (section "The Android app").
     Hand-rolled redirect because Astro's `redirects` option doesn't apply `base` to the
     destination (same pattern as public/cli.html). Kept so old links never 404. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to the NoteFlow privacy policy</title>
    <meta http-equiv="refresh" content="0;url=/noteflow/privacy/#android" />
    <link rel="canonical" href="https://yagoid.github.io/noteflow/privacy/" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <a href="/noteflow/privacy/#android">The NoteFlow Mobile privacy policy is now part of the NoteFlow privacy policy.</a>
  </body>
</html>
