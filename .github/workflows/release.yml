name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-14
            platform: mac

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive app version from tag
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ ! "$tag" =~ ^v ]]; then
            echo "Tag '$tag' must start with 'v'" && exit 1
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$version' is not a valid semver-like value" && exit 1
          fi
          echo "APP_VERSION=$version" >> $GITHUB_ENV
          echo "Using app version '$version' from tag '$tag'"

      - name: Sync package.json version
        shell: bash
        run: |
          npm pkg set version="$APP_VERSION"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "$APP_VERSION" ]; then
            echo "package.json version '$pkg_version' does not match '$APP_VERSION'" && exit 1
          fi
          echo "package.json version synced to '$pkg_version'"

      - name: Build Electron App
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: no Developer ID — don't search for a signing identity. This makes
          # electron-builder ad-hoc sign the .app (required so the app and native
          # modules run on Apple Silicon). The build is not notarized; users bypass
          # Gatekeeper on first launch (right-click → Open). Harmless on win/linux.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-win
          path: release-win

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-mac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # Created as a DRAFT on purpose. The in-app updater reads
          # /releases/latest, which ignores drafts: a published release would be
          # offered to existing clients while its assets may still be uploading
          # (404 on download) and before the notes are written. Publish by hand
          # once the assets are verified and the notes are in:
          #   gh release edit vX.Y.Z --notes-file notes.md
          #   gh release edit vX.Y.Z --draft=false
          draft: true
          # Tags with a pre-release suffix (e.g. v1.7.0-mac.1) publish as a
          # prerelease, which the in-app updater (/releases/latest) ignores — handy
          # for testing the macOS build without pushing it to existing users.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Kept, but in practice the generated body comes out empty: the real
          # notes are always written by hand (see .claude/context/release.md).
          generate_release_notes: true
          # Linux ships only .deb + AppImage (linux.target in package.json); no
          # pacman package is built.
          files: |
            release-win/*.exe
            release-win/*.exe.blockmap
            release-win/latest.yml
            release-linux/*.deb
            release-linux/*.AppImage
            release-linux/latest-linux.yml
            release-mac/*.dmg
            release-mac/*.dmg.blockmap
            release-mac/latest-mac.yml
